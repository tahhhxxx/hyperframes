<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        margin: 0; width: 1920px; height: 1080px;
        overflow: hidden; background: #0a0a1a;
      }
      #root { width: 1920px; height: 1080px; position: relative; }

      .scene {
        position: absolute; inset: 0;
        display: flex; flex-direction: column;
        align-items: center; justify-content: center;
      }

      /* Scene 1 */
      #s1 { background: linear-gradient(135deg, #0a0a1a 0%, #1e1b4b 100%); }
      #s1-title {
        font-family: sans-serif; font-size: 128px; font-weight: 900;
        color: #fff; letter-spacing: -4px;
        text-shadow: 0 0 120px #818cf8, 0 0 40px #6366f1;
      }
      #s1-sub {
        font-family: sans-serif; font-size: 52px;
        color: #a5b4fc; margin-top: 28px; letter-spacing: 2px;
      }

      /* Scene 2 */
      #s2 { background: #0a0a1a; }
      .feature-row {
        display: flex; gap: 80px; align-items: center;
      }
      .feature {
        font-family: sans-serif; text-align: center;
        display: flex; flex-direction: column; align-items: center; gap: 20px;
      }
      .feature-icon {
        width: 120px; height: 120px; border-radius: 24px;
        background: #1e1b4b; border: 2px solid #4338ca;
        display: flex; align-items: center; justify-content: center;
        font-size: 56px;
      }
      .feature-label {
        font-size: 40px; color: #e0e7ff; font-weight: 700;
      }
      .feature-desc { font-size: 28px; color: #6366f1; }
      #s2-heading {
        font-family: sans-serif; font-size: 64px; font-weight: 800;
        color: #fff; margin-bottom: 80px;
      }

      /* Scene 3 */
      #s3 { background: linear-gradient(135deg, #1e1b4b 0%, #0a0a1a 100%); }
      #s3-text {
        font-family: sans-serif; font-size: 96px; font-weight: 900;
        color: #818cf8; letter-spacing: -2px;
        text-shadow: 0 0 60px #6366f1;
      }
      #s3-sub {
        font-family: sans-serif; font-size: 44px; color: #c7d2fe;
        margin-top: 24px;
      }


      /* Scene 4 */
      #s4 {
  overflow: hidden;
  background: #000;
}

/* 動画 */
#bg-video {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
}

/* 暗幕 */
.overlay {
  position: absolute;
  inset: 0;
  background:
    radial-gradient(circle at center,
      rgba(255,255,255,0.05),
      rgba(0,0,0,0.45));
}

/* 金フレーム */
.ornament-frame {
  position: absolute;
  inset: 30px;

  border: 8px solid #b9995d;

  box-shadow:
    inset 0 0 0 3px #e4c98b,
    inset 0 0 0 10px #7f6131,
    0 0 40px rgba(0,0,0,0.5);
}

/* テロップ背景 */
.caption-box {
  position: absolute;

  left: 50%;
  top: 50%;

  transform-origin:center center;

  width: 1200px;

  padding: 40px 80px;

  background: rgba(20,20,30,.45);
  backdrop-filter: blur(6px);

  text-align: center;
}

/* テキスト */
.caption-line {
  font-family:
    "Yu Mincho",
    "Hiragino Mincho ProN",
    serif;

  color: white;

  font-size: 72px;
  font-weight: 700;

  line-height: 1.4;

  text-shadow:
    0 2px 3px rgba(0,0,0,.9),
    0 0 18px rgba(0,0,0,.5);
}

.caption-wrap {
  position:absolute;
  left:50%;
  top:50%;
  transform:translate(-50%,-50%);
}

    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="30"
      data-width="1920"
      data-height="1080"
    >
      <!-- Scene 1: タイトル 0〜5s -->
      <div id="s1" class="clip scene"
           data-start="0" data-duration="5" data-track-index="0">
        <div id="s1-title">HyperFrames</div>
        <div id="s1-sub">Write HTML. Render Video.</div>
      </div>

      <!-- Scene 2: フィーチャー 5〜9s -->
      <div id="s2" class="clip scene"
           data-start="5" data-duration="4" data-track-index="0">
        <div id="s2-heading">How it works</div>
        <div class="feature-row">
          <div class="feature" id="f1">
            <div class="feature-icon">📝</div>
            <div class="feature-label">Write HTML</div>
            <div class="feature-desc">Plain web tech</div>
          </div>
          <div class="feature" id="f2">
            <div class="feature-icon">🎬</div>
            <div class="feature-label">Add GSAP</div>
            <div class="feature-desc">Seekable timeline</div>
          </div>
          <div class="feature" id="f3">
            <div class="feature-icon">🎥</div>
            <div class="feature-label">Render MP4</div>
            <div class="feature-desc">Deterministic output</div>
          </div>
        </div>
      </div>

      <!-- Scene 3: アウトロ 9〜12s -->
      <div id="s3" class="clip scene"
           data-start="9" data-duration="3" data-track-index="0">
        <div id="s3-text">Open Source</div>
        <div id="s3-sub">by HeyGen · Apache 2.0</div>
      </div>
    </div>


    <!-- Scene 4 -->
     <div id="s4"
     class="clip scene"
     data-start="12"
     data-duration="18"
     data-track-index="0">

  <!-- 背景動画 -->
  <video
    id="bg-video"
    autoplay
    muted
    loop
    playsinline>
    <source
      src="https://storage.googleapis.com/gtv-videos-bucket/sample/ForBiggerJoyrides.mp4"
      type="video/mp4">
  </video>

  <div class="overlay"></div>

  <!-- フレーム -->
  <div class="ornament-frame"></div>

  <!-- テロップ -->
   <div class="caption-wrap">
  <div class="caption-box">
    <div id="line1" class="caption-line"></div>
    <div id="line2" class="caption-line"></div>
  </div>
  </div>

</div>

    <script>
      window.__timelines = window.__timelines || {};

      const tl = gsap.timeline({ paused: true });
      const captions = [
  ["しし座に木星が入るとき、", "さそり座との間に"],
  ["新しい運命の流れが", "始まるでしょう"],
  ["停滞していた出来事が", "動き始めます"],
  ["その変化は", "想像以上です"]
];

function setCaption(index) {
  document.getElementById("line1").textContent =
    captions[index][0];

  document.getElementById("line2").textContent =
    captions[index][1];
}

      // Scene 1: タイトルフェードイン
      tl.from("#s1-title", { opacity: 0, y: 60, duration: 1.0, ease: "power3.out" }, 0.2)
        .from("#s1-sub",   { opacity: 0, y: 30, duration: 0.8, ease: "power2.out" }, 1.0);

      // Scene 2: フィーチャー順番に出現
      tl.from("#s2-heading", { opacity: 0, y: -40, duration: 0.6, ease: "power2.out" }, 5.2)
        .from("#f1", { opacity: 0, y: 50, duration: 0.5, ease: "back.out(1.5)" }, 5.8)
        .from("#f2", { opacity: 0, y: 50, duration: 0.5, ease: "back.out(1.5)" }, 6.2)
        .from("#f3", { opacity: 0, y: 50, duration: 0.5, ease: "back.out(1.5)" }, 6.6);

      // Scene 3: アウトロ
      tl.from("#s3-text", { opacity: 0, scale: 0.8, duration: 0.7, ease: "back.out(1.7)" }, 9.3)
        .from("#s3-sub",  { opacity: 0,             duration: 0.5, ease: "power2.out"     }, 10.1);

// ----------------------
// Scene 4
// ----------------------

const scene4Start = 12;

captions.forEach((lines, i) => {

  const start = scene4Start + (i * 4);

  tl.call(() => {
    setCaption(i);
  }, null, start);

tl.fromTo(
  ".caption-box",
  {
    opacity: 0,
    scale: 0.96,
    filter: "blur(12px)"
  },
  {
    opacity: 1,
    scale: 1,
    filter: "blur(0px)",
    duration: 1,
    ease: "power2.out"
  },
  start
);

  tl.to(
    ".caption-box",
    {
      opacity: 0,
      scale: 1.03,
      filter: "blur(12px)",
      duration: 1,
      ease: "power2.in"
    },
    start + 3
  );
});

      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
