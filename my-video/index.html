<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@hyperframes/core/dist/hyperframe.runtime.iife.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@hyperframes/shader-transitions/dist/index.global.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #000;
      }

      /* ===== 固定背景：額縁＋天使（動かさない） ===== */
      .bg {
        position: absolute;
        inset: 0;
        z-index: 0;
      }
      .frame-img {
        position: absolute;
        top: 0;
        left: 0;
        width: 1920px;
        height: 1080px;
        object-fit: cover;
        z-index: 1;
      }
      .angel-wrap {
        position: absolute;
        top: 0;
        left: 0;
        width: 1920px;
        height: 1080px;
        padding: 94px 116px;
        overflow: hidden;
        z-index: 2;
      }
      .angel-img {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }

      /* ===== 合成（HyperFrames） ===== */
      #main {
        position: absolute;
        inset: 0;
        z-index: 2;
      }
      .scene {
        position: absolute;
        top: 0;
        left: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
      }
      .scene-content {
        position: relative;
        width: 100%;
        height: 100%;
        z-index: 1;
      }
      .clip {
      }

      /* ===== テキスト層 ===== */
      .text-layer {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      /* 全シーンのボックスを同じグリッドセルに重ねる（中央配置） */
      .band-grid {
        display: grid;
        place-items: center;
      }
      .band-grid > .text-band {
        grid-area: 1 / 1;
      }
      /* 黒半透明ボックス：テキストを内包し padding:100px でサイズが決まる（幅・高さ固定にしない） */
      .text-band {
        position: relative;
        max-width: 1688px;
        background: rgba(0, 0, 0, 0.35);
        /* 可視状態は GSAP が opacity で制御（ボックスごとフェードアウト） */
        opacity: 0;
        /* フェードを毎フレーム再描画ではなくGPU合成にする（もっさり対策） */
        will-change: transform, opacity;
        transform: translateZ(0);
        backface-visibility: hidden;
      }
      /* シーンごとのテキストブロック */
      .block {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 0.4em;
        padding: 100px;
      }
      .line {
        margin: 0;
        color: #ffffff;
        text-align: center;
        font-family: "Yu Mincho", "Hiragino Mincho ProN", serif;
        font-size: 88px;
        font-weight: 600;
        line-height: 1.5;
        letter-spacing: normal;
        text-shadow:
          0 2px 8px rgba(0, 0, 0, 0.75),
          0 0 24px rgba(0, 0, 0, 0.5);
        opacity: 1;
        white-space: nowrap;
      }
      .hl {
        display: inline-block;
        transform-origin: center center;
        will-change: transform;
      }
      /* blockSpan用：ブロック全体のtransform基点 */
      .block-span {
        display: inline-block;
        transform-origin: center center;
      }
    </style>
  </head>
  <body>
    <!-- ===== 固定背景（#main の外＝常に静止） ===== -->
    <div class="bg">
      <img class="frame-img" src="images/frame.png" alt="額縁" />
      <div class="angel-wrap">
        <img class="angel-img" src="images/angel.png" alt="天使" />
      </div>
    </div>

    <!-- ===== 台本 JSON（Untitled-1.json をそのまま） ===== -->
    <script id="script" type="application/json">

    <!-- ===== 合成本体 ===== -->
    <div
      id="main"
      data-composition-id="main"
      data-width="1920"
      data-height="1080"
      data-start="0"
      data-duration="60"
    >
      <div class="scene clip" id="s1" data-start="0" data-duration="60" data-track-index="0" data-screen-label="01">
        <div class="scene-content">
          <div class="text-layer">
            <!-- 各シーンの黒半透明ボックスをJSがここに生成して重ねる -->
            <div class="band-grid" id="band"></div>
          </div>
        </div>
      </div>
    </div>

    <script>
      var data = JSON.parse(document.getElementById("script").textContent);
      var band = document.getElementById("band");
      var COLORS = data.meta.presets.colors;

      // target文字列を<span class="hl">で包む（最初の出現のみ、正規表現不使用）
      function wrapInline(line, target) {
        var frag = document.createDocumentFragment();
        if (!target) {
          frag.appendChild(document.createTextNode(line));
          return frag;
        }
        var idx = line.indexOf(target);
        if (idx === -1) {
          frag.appendChild(document.createTextNode(line));
          return frag;
        }
        if (idx > 0) frag.appendChild(document.createTextNode(line.slice(0, idx)));
        var span = document.createElement("span");
        span.className = "hl";
        span.textContent = target;
        frag.appendChild(span);
        var rest = line.slice(idx + target.length);
        if (rest) frag.appendChild(document.createTextNode(rest));
        return frag;
      }

      // 各シーンのDOM生成：シーンごとに独立した黒半透明ボックス(.text-band)を作る
      data.scenes.forEach(function (sc, i) {
        var box = document.createElement("div");
        box.className = "text-band";
        box.id = "box" + i;

        var block = document.createElement("div");
        block.className = "block";
        block.id = "blk" + i;

        // blockSpan：ブロック全文をひとつのspanで包み、transform/colorの基点にする
        var inner = document.createElement("span");
        inner.className = "block-span";
        inner.id = "blkspan" + i;

        var target = sc.inlineSpan ? sc.inlineSpan.target : null;
        sc.lines.forEach(function (ln) {
          var p = document.createElement("p");
          p.className = "line";
          p.appendChild(wrapInline(ln, target));
          inner.appendChild(p);
        });
        block.appendChild(inner);
        box.appendChild(block);
        band.appendChild(box);
      });

      // ---- タイムライン構築 ----
      window.__timelines = window.__timelines || {};
      var tl = gsap.timeline({ paused: true });

      // 初期状態：全ボックスを非表示に
      gsap.set(".text-band", { autoAlpha: 0 });

      var GLOW = "0 0 30px rgba(255,210,140,0.85), 0 2px 8px rgba(0,0,0,0.7)";

      // color/motion を対象(targets)に適用する。時刻 at で発火。
      // ※ text-shadow を毎フレームtweenすると重い→ glow は set で一度だけ点灯し、
      //    脈動表現は scale で行う（GPUに乗るので軽い）。
      function applyEmphasis(targets, spec, at) {
        if (!spec) return;
        var col = COLORS[spec.color] || COLORS.default;

        // 色は常に set（瞬時）。motion=none なら色だけ。
        if (spec.color && spec.color !== "default") {
          if (spec.motion === "none") {
            tl.set(targets, { color: col }, at);
          } else {
            tl.to(targets, { color: col, duration: 0.4, ease: "power1.out" }, at);
          }
        }

        if (spec.motion === "glow") {
          // 発光を一度だけ点灯（再描画は1回）。
          tl.set(targets, { textShadow: GLOW }, at + 0.2);
        } else if (spec.motion === "glow-pulse") {
          // 発光を点灯しつつ、脈動は scale で表現（text-shadowはアニメしない）。
          tl.set(targets, { textShadow: GLOW }, at + 0.2);
          tl.fromTo(
            targets,
            { scale: 1 },
            { scale: 1.06, duration: 0.45, ease: "sine.inOut", yoyo: true, repeat: 1 },
            at + 0.2,
          );
        } else if (spec.motion === "pop") {
          tl.fromTo(
            targets,
            { scale: 1 },
            { scale: 1.08, duration: 0.45, ease: "sine.inOut", yoyo: true, repeat: 1 },
            at,
          );
        }
      }

      // フェード尺（短めにして「もっさり」を回避。power1系で均等サンプリング）
      var IN_DUR = 0.45; // 下からフェードアップしてくる時間
      var OUT_DUR = 0.4; // フェードアウトの時間
      var OVERLAP = 0.25; // 次のテキストが「前が消えきる前」に入り始める量＝空白ゼロ

      data.scenes.forEach(function (sc, i) {
        var box = "#box" + i;
        var blockSpan = "#blkspan" + i;
        var inlineSpans = "#box" + i + " .hl";
        var s = sc.start;
        var d = sc.duration;

        // --- 登場：下からフェードアップ ---
        //     2シーン目以降は境界より OVERLAP 早く入り始め、前のフェードアウトと重ねる＝空白なし
        var inStart = i === 0 ? s : s - OVERLAP;
        tl.fromTo(
          box,
          { autoAlpha: 0, y: 28 },
          { autoAlpha: 1, y: 0, duration: IN_DUR, ease: "power1.out" },
          inStart,
        );

        // --- 強調（color × motion）：表示直後に発火 ---
        applyEmphasis(blockSpan, sc.blockSpan, s + 0.3);
        if (sc.inlineSpan && document.querySelector(inlineSpans)) {
          applyEmphasis(inlineSpans, sc.inlineSpan, s + 0.45);
        }

        // --- 退場：境界ちょうどで消えきるようにフェードアウト（最終シーンは残す） ---
        if (i < data.scenes.length - 1) {
          tl.to(box, { autoAlpha: 0, duration: OUT_DUR, ease: "power1.in" }, s + d - OUT_DUR);
        }
      });

      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
