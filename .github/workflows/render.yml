name: Render Compositions

on:
  push:
    paths:
      - 'my-video/**'
  workflow_dispatch:

jobs:
  render:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true   # ← これを追加
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: FedericoCarboni/setup-ffmpeg@v3

      - name: Install headless browser
        working-directory: my-video
        run: npx hyperframes browser --install

      - name: Render
        working-directory: my-video
        run: npx hyperframes render --output output.mp4

      - uses: actions/upload-artifact@v4
        with:
          name: rendered-mp4
          path: my-video/output.mp4